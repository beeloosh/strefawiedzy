<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>📚 Strefa Wiedzy</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background:#f9f9f9;
      margin:0; padding:1rem;
      line-height:1.6; color:#444;
    }
    header {
      text-align:center; margin:1.5rem 0;
    }
    header h1 {
      color:#26295C; margin-bottom:.3rem;
    }
    nav {
      margin:1rem 0; text-align:center;
    }
    nav a {
      margin:0 .6rem;
      color:#56AFE3; font-weight:600; text-decoration:none;
    }
    nav a:hover { text-decoration:underline; }

    section {
      max-width:900px; margin:2rem auto;
      background:#fff; padding:1.5rem 2rem;
      border-radius:16px;
      box-shadow:0 2px 6px rgba(0,0,0,.1);
    }
    h2 { color:#26295C; margin-top:0; }
    h3 { margin:.8rem 0 .4rem; }
    .news-item {
      margin-bottom:1.2rem; padding-bottom:.8rem;
      border-bottom:1px solid #eee;
    }
    .news-item:last-child { border:none; }
    .news-item a {
      color:#56AFE3; font-weight:600; text-decoration:none;
    }
    .news-item a:hover { text-decoration:underline; }
  </style>
</head>
<body>

  <header>
    <h1>📚 Strefa Wiedzy</h1>
    <p>Twoje centrum nauki i inspiracji</p>
  </header>

  <nav>
    <a href="index.html">Strona główna</a>
    <a href="gry.html">Gry i quizy</a>
    <a href="poradniki.html">Poradniki</a>
  </nav>

  <section id="nowosci">
    <h2>🆕 Nowości</h2>
    <div id="news-list">
      <p>Ładowanie nowości...</p>
    </div>
  </section>

  <footer style="text-align:center; margin:2rem 0; color:#777;">
    <p>© 2025 Strefa Wiedzy</p>
  </footer>

  <script>
  // Wczytywanie nowości z pliku nowosci.json
  fetch("nowosci.json")
    .then(res => {
      if (!res.ok) throw new Error("Błąd sieci");
      return res.json();
    })
    .then(data => {
      const newsList = document.getElementById("news-list");
      newsList.innerHTML = ""; // czyścimy "Ładowanie..."
      data.forEach(item => {
        const div = document.createElement("div");
        div.className = "news-item";
        div.innerHTML = `
          <h3>${item.title}</h3>
          <p>${item.desc}</p>
          <a href="${item.link}" target="_blank" rel="noopener">🔗 Zobacz</a>
        `;
        newsList.appendChild(div);
      });
    })
    .catch(err => {
      document.getElementById("news-list").innerHTML =
        "<p style='color:red'>Nie udało się wczytać nowości.</p>";
      console.error(err);
    });
  </script>
</body>
</html>
