<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>📚 Strefa Wiedzy</title>
  <style>
    :root{
      --brand:#26295C;
      --acc:#56AFE3;
      --bg:#f7f7fa;
      --card:#fff;
      --muted:#6b7280;
      --shadow:0 2px 6px rgba(0,0,0,.1);
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background:var(--bg); color:#444; margin:0; padding:0;
      line-height:1.6;
    }
    header{ text-align:center; padding:24px 16px 12px }
    header h1{ color:var(--brand); margin:.2rem 0 }
    header p{ color:var(--muted); margin:0 0 .6rem }
    nav{ text-align:center; margin:.4rem 0 1.2rem }
    nav a{
      display:inline-block; margin:0 .6rem; text-decoration:none;
      color:var(--acc); font-weight:600;
    }
    nav a:hover{ text-decoration:underline }

    .section{
      max-width:1100px; margin: 0 auto 32px; padding: 16px;
    }
    .panel{
      background:var(--card); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:18px 18px 8px;
    }
    .panel h2{
      color:var(--brand); margin:0 0 12px; display:flex; align-items:center; gap:.5rem;
      font-size:1.5rem;
    }
    .badge{
      display:inline-flex; align-items:center; gap:.35rem;
      font-size:.85rem; background:#e9f3ff; color:#1e60a8;
      padding:.2rem .5rem; border-radius:.5rem; font-weight:700;
    }
    .grid{
      display:grid; gap:22px;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      padding:10px 6px 18px;
    }
    .card{
      background:var(--card); border-radius:14px; box-shadow:var(--shadow);
      padding:16px; display:flex; flex-direction:column; min-height:190px;
    }
    .card h3{ color:var(--brand); margin:.2rem 0 .4rem; font-size:1.15rem }
    .card p{ margin:0 0 1rem; color:#555 }
    .btn{
      margin-top:auto; align-self:flex-start;
      background:var(--acc); color:#fff; text-decoration:none;
      padding:.65rem 1rem; border-radius:.7rem; font-weight:700;
    }
    .btn:hover{ filter:brightness(1.05) }
    .meta{
      display:flex; align-items:center; gap:.4rem; color:var(--muted);
      font-size:.9rem; margin:.2rem 0 .8rem
    }
    footer{ text-align:center; color:var(--muted); padding:24px 0 40px }
    /* fallback dla bardzo wąskich ekranów */
    @media (max-width:360px){
      .grid{ grid-template-columns:1fr }
    }
  </style>
</head>
<body>
  <header>
    <h1>📚 Strefa Wiedzy</h1>
    <p>Twoje centrum nauki i inspiracji</p>
    <nav>
      <a href="index.html">Strona główna</a>
      <a href="gry.html">Gry i quizy</a>
      <a href="poradniki.html">Poradniki</a>
    </nav>
  </header>

  <main class="section">
    <section class="panel" aria-labelledby="nowosci-heading">
      <h2 id="nowosci-heading"><span class="badge">NEW</span> Nowości</h2>

      <!-- Siatka kafelków z nowościami -->
      <div class="grid" id="news-grid">
        <!-- Fallback (zniknie po wczytaniu JSON): -->
        <div class="card" aria-live="polite">
          <h3>Ładowanie nowości…</h3>
          <p>Za chwilę zobaczysz najnowsze kafelki.</p>
        </div>
      </div>
    </section>
  </main>

  <footer>© 2025 Strefa Wiedzy</footer>

  <script>
    // Render nowości jako KAFELKI z pliku nowosci.json
    fetch("nowosci.json", {cache:"no-store"})
      .then(r => {
        if(!r.ok) throw new Error("HTTP "+r.status);
        return r.json();
      })
      .then(list => {
        const grid = document.getElementById("news-grid");
        grid.innerHTML = ""; // usuń fallback

        // Posortuj malejąco po dacie, jeśli jest (ISO string); w przeciwnym razie kolejność z pliku
        try{
          list.sort((a,b)=>{
            const da = Date.parse(a.date || 0);
            const db = Date.parse(b.date || 0);
            return isNaN(db)-isNaN(da) || db - da;
          });
        }catch(_){}

        list.forEach(item => {
          const card = document.createElement("div");
          card.className = "card";

          const isExternal = /^https?:\/\//i.test(item.link || "");
          const title = item.title || "Nowość";
          const desc  = item.desc  || "";
          const btn   = item.button || "Zobacz";
          const link  = item.link || "#";

          card.innerHTML = `
            <h3>${title}</h3>
            ${desc ? `<p>${desc}</p>` : ``}
            <div class="meta">${isExternal ? "🔗" : "📄"} ${item.source || (isExternal ? "Strona zewnętrzna" : "Wewnątrz Strefy")}</div>
            <a class="btn" href="${link}" ${isExternal ? 'target="_blank" rel="noopener"' : ""}>${btn}</a>
          `;
          grid.appendChild(card);
        });

        if(!grid.children.length){
          grid.innerHTML = `
            <div class="card">
              <h3>Brak nowości</h3>
              <p>Dodaj wpisy do <code>nowosci.json</code>, aby pojawiły się tutaj jako kafelki.</p>
            </div>`;
        }
      })
      .catch(err => {
        const grid = document.getElementById("news-grid");
        grid.innerHTML = `
          <div class="card">
            <h3>Nie udało się wczytać nowości</h3>
            <p style="color:#b42318">Sprawdź plik <code>nowosci.json</code> (poprawny JSON, dostępny pod tym samym adresem).</p>
          </div>`;
        console.error(err);
      });
  </script>
</body>
</html>
