<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎲 Quiz – Dopasuj znaczenie do emoji</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background:#f9f9f9;
      margin:0; padding:1rem;
      line-height:1.6; color:#444;
      max-width:900px; margin:auto;
    }
    h1 { text-align:center; color:#26295C; margin:1rem 0; }
    .back {
      display:block; text-align:center; margin: 1rem auto 1.5rem;
      background:#56AFE3; color:#fff; padding:.6rem 1.2rem;
      border-radius:.6rem; text-decoration:none; font-weight:600; width:fit-content;
    }
    .question {
      margin-bottom: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background:#fff;
    }
    .question p { font-weight: bold; color:#26295C; }
    select {
      padding: 8px; font-size: 1rem; margin-top: 8px;
    }
    button {
      margin: 10px 10px 0 0;
      padding: 10px 20px;
      background: #56AFE3;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight:600;
    }
    button:hover { filter:brightness(1.1); }
    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      color:#26295C;
    }
  </style>
</head>
<body>

  <h1>🎲 Quiz – Dopasuj znaczenie do emoji</h1>
  <a class="back" href="ciekawostka-emotikony.html">⬅️ Wróć do ciekawostki</a>

  <form id="quizForm">
    <div class="question">
      <p>1. 😂</p>
      <select name="q1">
        <option value="">-- wybierz --</option>
        <option value="a">Śmiech do łez</option>
        <option value="b">Zakochanie</option>
        <option value="c">Zmęczenie</option>
        <option value="d">Złość</option>
      </select>
    </div>

    <div class="question">
      <p>2. 🤔</p>
      <select name="q2">
        <option value="">-- wybierz --</option>
        <option value="a">Myślenie</option>
        <option value="b">Impreza</option>
        <option value="c">Smutek</option>
        <option value="d">Kłótnia</option>
      </select>
    </div>

    <div class="question">
      <p>3. ❤️</p>
      <select name="q3">
        <option value="">-- wybierz --</option>
        <option value="a">Jedzenie</option>
        <option value="b">Miłość</option>
        <option value="c">Ziewanie</option>
        <option value="d">Podróż</option>
      </select>
    </div>

    <div class="question">
      <p>4. 😴</p>
      <select name="q4">
        <option value="">-- wybierz --</option>
        <option value="a">Zmęczenie / sen</option>
        <option value="b">Żart</option>
        <option value="c">Miłość</option>
        <option value="d">Złość</option>
      </select>
    </div>

    <div class="question">
      <p>5. 🎉</p>
      <select name="q5">
        <option value="">-- wybierz --</option>
        <option value="a">Świętowanie</option>
        <option value="b">Smutek</option>
        <option value="c">Choroba</option>
        <option value="d">Zakłopotanie</option>
      </select>
    </div>

    <button type="button" onclick="checkAnswers()">Sprawdź wyniki</button>
    <button type="reset">Spróbuj ponownie</button>
  </form>

  <div id="result"></div>

  <script>
    function checkAnswers() {
      let score = 0;
      const form = document.forms["quizForm"];

      if (form.q1.value === "a") score++;
      if (form.q2.value === "a") score++;
      if (form.q3.value === "b") score++;
      if (form.q4.value === "a") score++;
      if (form.q5.value === "a") score++;

      document.getElementById("result").textContent = 
        "Twój wynik: " + score + " / 5 🎉";
    }
  </script>
</body>
</html>
